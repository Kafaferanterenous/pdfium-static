name: Build PDFium

on:
  workflow_dispatch:
    inputs:
      pdfium_branch:
        description: 'PDFium chromium branch number'
        required: true
        default: '7734'
      release:
        description: 'Publish a GitHub release when every build passes'
        type: boolean
        default: true

env:
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
  PDFIUM_BRANCH: ${{ inputs.pdfium_branch }}
  EMSDK_VERSION: '4.0.23'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target_os: mac
            target_cpu: arm64
            artifact_name: libpdfium-macos-arm64
            lib_file: out/Default/obj/libpdfium.a
            extra_args: ""
          - os: ubuntu-22.04
            target_os: linux
            target_cpu: x64
            artifact_name: libpdfium-linux-x64
            lib_file: out/Default/obj/libpdfium.a
            # Bundle libc++ and build against glibc 2.27, so the library links
            # on Ubuntu 18.04 and RHEL 8 hosts.
            custom_libcxx: true
            extra_args: 'target_sysroot = "//build/linux/ubuntu_bionic_amd64-sysroot" use_glib = false'
          - os: windows-2025
            target_os: win
            target_cpu: x64
            artifact_name: pdfium-windows-x64
            lib_file: out/Default/obj/pdfium.lib
            extra_args: ""
          - os: ubuntu-22.04
            target_os: emscripten
            target_cpu: wasm
            artifact_name: libpdfium-wasm
            lib_file: out/Default/obj/libpdfium.a
            extra_args: "is_clang = false"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6

      - name: Install Emscripten SDK
        if: matrix.target_os == 'emscripten'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          $HOME/emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          $HOME/emsdk/emsdk activate ${{ env.EMSDK_VERSION }}
          echo "$HOME/emsdk" >> $GITHUB_PATH
          echo "$HOME/emsdk/upstream/emscripten" >> $GITHUB_PATH
          echo "EMSDK=$HOME/emsdk" >> $GITHUB_ENV

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Add Windows SDK to PATH
        if: matrix.target_os == 'win'
        shell: bash
        run: |
          SDK_BIN="/c/Program Files (x86)/Windows Kits/10/bin"
          SDK_VERSION=$(ls "$SDK_BIN" | grep '^10\.' | sort -V | tail -1)
          echo "$SDK_BIN/$SDK_VERSION/x64" >> $GITHUB_PATH

      - name: Select Xcode 26.0 (macOS)
        if: matrix.target_os == 'mac'
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Install Linux build deps
        if: matrix.target_os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Fetch PDFium
        shell: bash
        run: |
          mkdir pdfium-src && cd pdfium-src
          gclient config --unmanaged https://pdfium.googlesource.com/pdfium.git
          gclient sync -r origin/chromium/${{ env.PDFIUM_BRANCH }} --no-history --shallow

      - name: Build glibc 2.27 sysroot (Linux)
        if: matrix.target_os == 'linux'
        run: scripts/make-sysroot.sh pdfium-src/pdfium/build/linux/ubuntu_bionic_amd64-sysroot

      - name: Patch PDFium for Linux
        if: matrix.target_os == 'linux'
        working-directory: pdfium-src/pdfium
        run: python3 $GITHUB_WORKSPACE/scripts/patch-linux.py

      - name: Patch Windows resource compiler
        if: matrix.target_os == 'win'
        shell: bash
        working-directory: pdfium-src/pdfium
        run: sed -i.bak 's|"$python_path"|"rc.exe"|g' build/toolchain/win/toolchain.gni 2>/dev/null || true

      - name: Patch PDFium for Windows
        if: matrix.target_os == 'win'
        working-directory: pdfium-src/pdfium
        run: python3 $env:GITHUB_WORKSPACE/scripts/patch-win.py

      - name: Patch PDFium for WASM
        if: matrix.target_os == 'emscripten'
        working-directory: pdfium-src/pdfium
        run: python3 $GITHUB_WORKSPACE/scripts/patch-wasm.py

      - name: Configure and build
        shell: bash
        working-directory: pdfium-src/pdfium
        run: |
          mkdir -p out/Default
          cat > out/Default/args.gn << 'ARGS'
          is_debug = false
          is_component_build = false
          pdf_is_standalone = true
          pdf_is_complete_lib = true
          pdf_enable_xfa = false
          pdf_enable_v8 = false
          pdf_use_partition_alloc = false
          use_custom_libcxx = ${{ matrix.custom_libcxx || false }}
          treat_warnings_as_errors = false
          clang_use_chrome_plugins = false
          symbol_level = 0
          target_os = "${{ matrix.target_os }}"
          target_cpu = "${{ matrix.target_cpu }}"
          ${{ matrix.extra_args }}
          ARGS
          cat out/Default/args.gn
          gn gen out/Default
          ninja -C out/Default pdfium

      - name: Verify static library
        if: matrix.target_os != 'emscripten'
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/verify-native.sh "pdfium-src/pdfium/${{ matrix.lib_file }}" "${{ matrix.target_os }}"

      - name: Test on Ubuntu 18.04 (Linux)
        if: matrix.target_os == 'linux'
        working-directory: pdfium-src/pdfium
        run: $GITHUB_WORKSPACE/scripts/verify-glibc.sh ${{ matrix.lib_file }}

      - name: Test WASM with emcc
        if: matrix.target_os == 'emscripten'
        working-directory: pdfium-src/pdfium
        run: $GITHUB_WORKSPACE/scripts/test-wasm.sh out/Default/obj/libpdfium.a

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: pdfium-src/pdfium/${{ matrix.lib_file }}

  # Windows runners cannot run Linux containers, so this check runs here.
  verify-windows-xwin:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Download Windows library
        uses: actions/download-artifact@v8
        with:
          name: pdfium-windows-x64
          path: win

      - name: Link into a DLL with the cargo-xwin CRT
        run: scripts/verify-xwin.sh win/pdfium.lib

  release:
    needs: [build, verify-windows-xwin]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            file=$(find "$dir" -type f | head -1)
            ext="${file##*.}"
            cp "$file" "release/${name}.${ext}"
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chromium/${{ env.PDFIUM_BRANCH }}
          name: "chromium/${{ env.PDFIUM_BRANCH }}"
          body: |
            Static PDFium libraries built from `chromium/${{ env.PDFIUM_BRANCH }}`.

            ### Usage with pdfium-render

            Match the `pdfium_XXXX` feature flag in `pdfium-render` to this branch number.

            ### Files

            | File | Platform |
            |------|----------|
            | `libpdfium-macos-arm64.a` | macOS ARM64 (Apple Silicon) |
            | `libpdfium-linux-x64.a` | Linux x86_64 |
            | `pdfium-windows-x64.lib` | Windows x86_64 |
            | `libpdfium-wasm.a` | WebAssembly (Emscripten) |
          files: release/*
          make_latest: true
